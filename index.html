<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | QR code component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }

    /* 1. Reset básico para limpar as margens do navegador */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Outfit', sans-serif; /* Fonte padrão do desafio */
  background-color: #d5e1ef; /* Azul claro do fundo */
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 1.25rem;
}

/* 2. Estilização do Card (o container principal) */
.card {
  background-color: #ffffff;
  max-width: 320px;
  padding: 1rem;
  border-radius: 20px;
  box-shadow: 0px 15px 30px rgba(0, 0, 0, 0.05);
  text-align: center;
}

/* 3. Imagem do QR Code */
.card img {
  width: 100%;
  height: auto;
  border-radius: 10px;
  display: block;
}

/* 4. Título Principal */
.card h3 {
  color: #1f314f; /* Azul escuro */
  font-size: 1.375rem;
  font-weight: 700;
  margin: 1.5rem 0 1rem 0;
  padding: 0 0.5rem;
  line-height: 1.3;
}

/* 5. Texto de Descrição */
.card p {
  color: #7d889e; /* Cinza azulado */
  font-size: 0.9375rem;
  font-weight: 400;
  margin-bottom: 1.5rem;
  padding: 0 1rem;
  line-height: 1.4;
}

/* Atribuição no rodapé */
.attribution {
  position: absolute;
  bottom: 10px;
  width: 100%;
  font-size: 0.6875rem;
  text-align: center;
}
.attribution a { 
  color: hsl(228, 45%, 44%); 
}


  </style>
</head>
<body>
  <div class="card">
    <div><img src="images/image-qr-code.png" alt="qrcode"></div>
    <h3><strong>Improve your front-end skills by building projects</strong></h3>

    <p>Scan  the  QR code to visit Frontend <br> Mentor and take your coding skills to thwe next level</p>
  </div>
  
  <div class="attribution">
  <!-- Seus links de crédito aqui -->
  </div>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</body>
</html>
